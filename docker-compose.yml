services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maximus_postgres
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentraai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pentraai}
      POSTGRES_DB: ${POSTGRES_DB:-pentraai_assessments}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maximus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentraai} -d ${POSTGRES_DB:-pentraai_assessments}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  # MAXIMUS extends AIDA's backend with /api/v1/pro/* routes:
  #   CVE lookup (NVD API v2.0), JS secret scanner, scope enforcer
  backend:
    image: maximus-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maximus_backend
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: ${DB_HOST:-postgres}
      POSTGRES_DB: ${DB_NAME:-pentraai_assessments}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:31337,http://127.0.0.1:31337}
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend/logs:/app/logs:z
    networks:
      - maximus-network
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── React Frontend (MAXIMUS Custom) ────────────────────────────────────────
  # Hacker-themed React UI with Pro Tools panel (CVE, JS Scanner, Scope Manager)
  frontend:
    image: maximus-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maximus_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:31337:5173"
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:5173:5173"
    networks:
      - maximus-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Docker Socket Proxy ─────────────────────────────────────────────────────
  # Filtered Docker API: only container inspect + exec are allowed.
  # Prevents backend from escaping to the host via Docker socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: maximus_docker_proxy
    restart: unless-stopped
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      BUILD: 0
      AUTH: 0
      SECRETS: 0
      PLUGINS: 0
      INFO: 0
      VERSION: 0
      EVENTS: 0
      DISTRIBUTION: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - maximus-network

  # ─── MAXIMUS Pentest Container ───────────────────────────────────────────────
  # Lightweight execution environment: nmap, ffuf, gobuster, sqlmap, nikto,
  # hydra, nuclei, subfinder, httpx + Python pentest libs + SecLists wordlists.
  maximus-pentest:
    image: vasco0x4/aida-pentest:latest
    container_name: maximus-pentest
    tty: true
    stdin_open: true
    volumes:
      - ${HOME}/.maximus/workspaces:/workspace
    networks:
      - pentest-network
    restart: unless-stopped

networks:
  maximus-network:
    name: maximus-network
    driver: bridge
  pentest-network:
    name: maximus-pentest-network
    driver: bridge

volumes:
  postgres_data:
    name: pentraai_postgres_data
