# Production overlay — used by ./start.sh (default mode)
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    environment:
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:31337,http://127.0.0.1:31337}"
      ENVIRONMENT: production

  frontend:
    image: vasco0x4/aida-frontend:latest
    build:
      context: ../AIDA/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:31337:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
